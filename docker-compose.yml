# 개발용 인프라: 실전 시험 회차 DB(PostgreSQL)와 초대 메일 확인용 SMTP(Mailpit)
#   docker compose up -d
#   메일함: http://localhost:8025
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: pair
      POSTGRES_USER: pair
      POSTGRES_PASSWORD: pair
    ports:
      - "5432:5432"
    volumes:
      - pair-pg:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pair-pg:
