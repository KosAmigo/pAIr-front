server:
  port: 8180

spring:
  application:
    name: pair-backend
  ai:
    # API 키: 값은 여기 쓰지 않는다. 시스템 환경 변수를 가리키기만 한다.
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    # Spring AI 자동 설정 모델은 쓰지 않는다. 자동 설정은 기본 temperature(0.7, 0.8)를 넣는데
    # 최신 추론 모델은 temperature 를 받지 않아서, 모델은 코드(com.pair.ai.SpringAi)에서 빌더로 만든다.
    # 키가 없을 때 서버가 아예 안 켜지는 것도 막는다(키가 없으면 그 기능을 쓸 때만 오류).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

pair:
  # 응시 기록을 쌓는 폴더 (bootRun 은 저장소 루트에서 실행되므로 pAIr/pilot-data)
  data-dir: pilot-data

  # 응시자가 쓰는 AI 어시스턴트. R2 다시 실행도 같은 설정을 쓴다.
  assistant:
    provider: openai
    model: gpt-6-luna
    # 추론(reasoning) 모델은 생각에 쓰는 토큰도 이 한도에 포함된다. 너무 작으면 답이 비어서 온다.
    max-output-tokens: 8000
    # 추론 강도: none, minimal, low, medium, high. 낮을수록 빠르고 싸며 한도에 덜 걸린다.
    reasoning-effort: low
    max-turns: 40
    # 응시자 질문 한 번의 최대 글자 수 (프론트 입력창 글자 수 표시와 같은 값)
    max-input-chars: 1000
    system-prompt: >-
      당신은 개발 및 기획 과제를 돕는 AI 어시스턴트입니다.
      사용자가 대화에 직접 붙여 넣은 내용만 볼 수 있습니다.
      한국어로 간결하고 정확하게 답하세요.

  # 채점: 서로 다른 회사 모델 두 개로 이중 채점한다.
  # 판정 체크는 두 모델의 감점을 평균한다(한쪽만 걸림이면 '판정 엇갈림', 절반 감점).
  judge:
    claude:
      model: claude-haiku-5-5      # 비용 우선. 더 정확하게 보려면 claude-sonnet-5-5
      effort: medium               # Spring AI 1.1 에 옵션이 없어 요청에 직접 넣음 (AnthropicEffortInterceptor)
      max-tokens: 16000
    openai:
      model: gpt-6.1-terra
      effort: medium
      max-tokens: 16000
    # 다시 실행(R1) 결과 비교에 쓸 모델
    replay-compare: openai

  # (예비) Claude 를 어시스턴트로 쓸 때의 모델. 이번 파일럿에서는 쓰지 않는다.
  claude-assistant-model: claude-haiku-5-5

  # 응시자 코드 테스트 실행
  run:
    timeout-seconds: 30

  # 출력 안정성(R2): 핵심 턴 최대 개수와 턴마다 다시 실행할 횟수
  r2:
    max-key-turns: 3
    replays-per-turn: 3
