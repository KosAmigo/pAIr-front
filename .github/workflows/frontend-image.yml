name: Frontend Image

# main 에 병합되면 프론트 도커 이미지(nginx + 정적 파일)를 만들어 GitHub 컨테이너 저장소(GHCR)에 올린다.
# 서버에 반영하는 일(pull 과 재시작)은 하지 않는다. 비밀값은 GITHUB_TOKEN 만 쓴다.
# 이미지 Dockerfile 은 pAIr-back 저장소의 docker/frontend.Dockerfile 을 그대로 쓴다 (docker-compose.yml 의 frontend 서비스와 같은 파일).
# main 이 아닌 브랜치에서 손으로 실행(workflow_dispatch)하면 latest 는 붙이지 않고 sha 태그만 올린다.
#
# 번들에 박히는 값(VITE_*)은 저장소 변수(Settings > Secrets and variables > Actions > Variables)에서 읽는다.
#   VITE_TOSS_CLIENT_KEY  토스 테스트 클라이언트 키 (없으면 결제 화면이 키 오류를 낸다)
#   VITE_API_BASE, VITE_PROCTOR_RELAY_URL  백엔드가 다른 호스트일 때만. 비우면 같은 호스트의 /api, /ws (nginx 가 백엔드로 넘긴다)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Dockerfile 을 가져올 pAIr-back 의 브랜치. pAIr-back 의 main 에 docker/ 가 들어가면 main 으로 바꾼다
  BACK_REF: develop

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: KosAmigo/pAIr-back
          ref: ${{ env.BACK_REF }}
          path: back

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pair-front" >> "$GITHUB_ENV"

      # Vite 는 .env.production 을 빌드 때 읽는다. 값은 저장소 변수에서만 가져오고 저장소에는 두지 않는다
      - name: Build-time env
        env:
          VITE_TOSS_CLIENT_KEY: ${{ vars.VITE_TOSS_CLIENT_KEY }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_PROCTOR_RELAY_URL: ${{ vars.VITE_PROCTOR_RELAY_URL }}
        run: |
          {
            [ -n "$VITE_TOSS_CLIENT_KEY" ] && echo "VITE_TOSS_CLIENT_KEY=$VITE_TOSS_CLIENT_KEY"
            [ -n "$VITE_API_BASE" ] && echo "VITE_API_BASE=$VITE_API_BASE"
            [ -n "$VITE_PROCTOR_RELAY_URL" ] && echo "VITE_PROCTOR_RELAY_URL=$VITE_PROCTOR_RELAY_URL"
            true
          } > frontend/.env.production

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: back/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
