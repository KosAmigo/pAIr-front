name: Frontend CI

# main 이 아닌 브랜치에 push 할 때마다 린트, 빌드, 단위 테스트를 돌린다. 비밀값은 필요 없다.
# main 푸시는 release.yml 이 이 워크플로를 호출해서 돌린다 (테스트가 통과해야 이미지 빌드와 배포로 넘어간다).
# 그래서 main 은 여기서 따로 돌리지 않는다. 같은 테스트가 두 번 도는 것을 막는다.
# 화면 동작 검사(Playwright e2e)는 브라우저 설치와 백엔드가 필요해 여기서는 돌리지 않는다.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Dockerfile(node:22)과 같은 버전. 테스트가 쓰는 --experimental-strip-types 는 22.6 이상에서 동작한다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (타입 검사 + 번들)
        run: npm run build

      - name: Unit tests
        run: |
          npm run test:auth
          npm run test:credits
          npm run test:task-gen
          npm run test:review
          npm run test:replay
          npm run test:live-diagnostics
          npm run test:chat-attach
          npm run test:anti-cheating
          npm run test:proctor
          npm run test:scripts
          npm run test:questions
